name: iOS App Compilation & Packaging

on:
  push:

jobs:
  build-ipa:
    runs-on: macos-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Compile and Run Makedefs
        run: |
          #diff -qr ./nethack ./nethack36
          cd nethack36
          echo "CFLAGS += -Wno-strict-prototypes -Wno-deprecated-non-prototype" >> sys/unix/hints/macosx
          sh sys/unix/setup.sh sys/unix/hints/macosx
          make makedefs
          make bogusmon data engrave epitaph rumors quest.dat oracles options spec_levs dungeon
          make clean
          cd ..

      - name: Compile and Run Tilemap Generator
        run: |
          cp nethack/include/* nethack36/include
          cp nethack/src/* nethack36/src
          cp -r nethack/win/iphone nethack36/win
          cd nethack36/win
          gcc -I../include -I../src -Wp,-w -DSTATUES_LOOK_LIKE_MONSTERS share/tilemap.c -o tilemap_generator
          ./tilemap_generator
          ls ../src
          rm tilemap_generator
          cd ../..

      - name: Generate Xcode Project File
        run: xcodegen generate

      - name: Force Xcode Version
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: "Compile App for Physical iPhone Hardware"
        run: |
          xcodebuild build \
            -project "iNetHack2.xcodeproj" \
            -scheme "iNetHack2" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "${{ github.workspace }}/build_output" \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS="arm64" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            -quiet

      - name: "Package App Layout into an .ipa Installer"
        run: |
          rm -rf Payload
          mkdir -p Payload
          cp -r "${{ github.workspace }}/build_output/Build/Products/Release-iphoneos/iNetHack2.app" Payload/
          zip -r iNetHack2.ipa Payload

      - name: "Upload Installer to GitHub Actions"
        uses: actions/upload-artifact@v4
        with:
          name: iNetHack2-iPhone-Installer
          path: iNetHack2.ipa

  deploy-testflight:
    runs-on: macos-latest
    needs: build-ipa   # or standalone, your call
    steps:
      - name: Check macOS version
        run: sw_vers
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Compile and Run Makedefs
        run: |
          #diff -qr ./nethack ./nethack36
          cd nethack36
          echo "CFLAGS += -Wno-strict-prototypes -Wno-deprecated-non-prototype" >> sys/unix/hints/macosx
          sh sys/unix/setup.sh sys/unix/hints/macosx
          make makedefs
          make bogusmon data engrave epitaph rumors quest.dat oracles options spec_levs dungeon
          make clean
          cd ..

      - name: Compile and Run Tilemap Generator
        run: |
          cp nethack/include/* nethack36/include
          cp nethack/src/* nethack36/src
          cp -r nethack/win/iphone nethack36/win
          cd nethack36/win
          gcc -I../include -I../src -Wp,-w -DSTATUES_LOOK_LIKE_MONSTERS share/tilemap.c -o tilemap_generator
          ./tilemap_generator
          ls ../src
          rm tilemap_generator
          cd ../..

      - name: Generate Xcode Project File
        run: xcodegen generate

      - name: Force Xcode Version
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install signing certificate and provisioning profil
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_DIST_CERT_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles

      - name: Archive app
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
        run: |
          xcodebuild archive \
            -project "iNetHack2.xcodeproj" \
            -scheme "iNetHack2" \
            -configuration Distribution \
            -archivePath "$RUNNER_TEMP/iNetHack2.xcarchive" \
            -destination "generic/platform=iOS" \
            CODE_SIGN_STYLE=Manual \
            "CODE_SIGN_IDENTITY=Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            DEVELOPMENT_TEAM="$TEAM_ID"

      - name: Export .ipa
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>ge.zima.nethack</key>
              <string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/iNetHack2.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"

      - name: Upload to TestFlight
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          mkdir -p ~/private_keys
          echo -n "$API_KEY_BASE64" > ~/private_keys/AuthKey_$API_KEY_ID.p8

          xcrun altool --upload-app \
            -f "$RUNNER_TEMP/export/iNetHack2.ipa" \
            -t ios \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_ISSUER_ID"
