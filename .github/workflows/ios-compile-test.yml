name: iOS App Compilation & Packaging

on:
  push:

jobs:
  build-ipa:
    runs-on: macos-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Compile and Run Makedefs
        run: |
          cp -r nethack/ nethack36/
          #diff -qr ./nethack ./nethack36
          cd nethack36
          echo "CFLAGS += -Wno-strict-prototypes -Wno-deprecated-non-prototype" >> sys/unix/hints/macosx
          sh sys/unix/setup.sh sys/unix/hints/macosx
          echo "#define MAIL" >> include/config.h
          echo "#define SELF_RECOVER" >> include/config.h
          make makedefs
          make bogusmon data engrave epitaph rumors quest.dat oracles options spec_levs dungeon
          make clean
          cd ..

      - name: Compile and Run Tilemap Generator
        run: |
          cd nethack36/win
          gcc -I../include -I../src -Wp,-w share/tilemap.c -o tilemap_generator
          ./tilemap_generator
          rm tilemap_generator
          cd ../..

      - name: Generate Xcode Project File
        run: xcodegen generate

      - name: Force Xcode Version
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: "Step 1: Clean Build Environment"
        run: echo "Environment verified. Structural data present."

      - name: "Step 2: Compile App for Physical iPhone Hardware"
        run: |
          xcodebuild build \
            -project "iNetHack2.xcodeproj" \
            -scheme "iNetHack2" \
            -configuration Debug \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "${{ github.workspace }}/build_output" \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS="arm64" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            -quiet

      - name: "Step 3: Package App Layout into an .ipa Installer"
        run: |
          rm -rf Payload
          mkdir -p Payload
          cp -r "${{ github.workspace }}/build_output/Build/Products/Debug-iphoneos/iNetHack2.app" Payload/
          zip -r iNetHack2.ipa Payload

      - name: "Step 4: Upload Installer to GitHub Actions"
        uses: actions/upload-artifact@v4
        with:
          name: iNetHack2-iPhone-Installer
          path: iNetHack2.ipa
