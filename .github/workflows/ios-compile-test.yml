name: iOS App Compilation & Packaging

on:
  push:

jobs:
  build-ipa:
    runs-on: macos-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Compile and Run Makedefs
        run: |
          #diff -qr ./nethack ./nethack36
          cd nethack36
          echo "CFLAGS += -Wno-strict-prototypes -Wno-deprecated-non-prototype" >> sys/unix/hints/macosx
          sh sys/unix/setup.sh sys/unix/hints/macosx
          make makedefs
          make bogusmon data engrave epitaph rumors quest.dat oracles options spec_levs dungeon
          make clean
          cd ..

      - name: Compile and Run Tilemap Generator
        run: |
          cp nethack/include/* nethack36/include
          cp nethack/src/* nethack36/src
          cp nethack/win/* nethack36/win
          cd nethack36/win
          gcc -I../include -I../src -Wp,-w -DSTATUES_LOOK_LIKE_MONSTERS share/tilemap.c -o tilemap_generator
          ./tilemap_generator
          ls ../src
          rm tilemap_generator
          cd ../..

      - name: Generate Xcode Project File
        run: xcodegen generate

      - name: Force Xcode Version
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: "Compile App for Physical iPhone Hardware"
        run: |
          xcodebuild build \
            -project "iNetHack2.xcodeproj" \
            -scheme "iNetHack2" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "${{ github.workspace }}/build_output" \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS="arm64" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            -quiet

      - name: "Package App Layout into an .ipa Installer"
        run: |
          rm -rf Payload
          mkdir -p Payload
          cp -r "${{ github.workspace }}/build_output/Build/Products/Release-iphoneos/iNetHack2.app" Payload/
          zip -r iNetHack2.ipa Payload

      - name: "Upload Installer to GitHub Actions"
        uses: actions/upload-artifact@v4
        with:
          name: iNetHack2-iPhone-Installer
          path: iNetHack2.ipa
