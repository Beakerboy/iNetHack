name: iOS App Compilation & Packaging

on:
  push:
    branches: [ main, dev ]
  pull_request:

jobs:
  build-ipa:
    runs-on: macos-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Force Xcode Version
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: "Step 1: Initialize Source, Dependencies & Mock Assets"
        run: |
          brew install xcodegen
          mkdir -p dat lib nethack/dat nethack/lib
          echo "mock data" > dat/nhdat
          echo "mock library" > lib/placeholder.txt
          echo "mock data" > nethack/dat/nhdat
          echo "mock library" > nethack/lib/placeholder.txt

          # Copy the core required system header
          cp nethack/sys/msdos/nhlua.h nethack/include/

          # Copy standard Lua headers to satisfy the relative lookup path layout
          mkdir -p nethack/lib/lua544/src
          cp nethack/submodules/lua/*.h nethack/lib/lua544/src/ || true
          cp nethack/submodules/lua/src/*.h nethack/lib/lua544/src/ || true

          # Generate the missing timing engine header definitions
          echo '#define AM_PM' > nethack/include/date.h
          echo '#define TIMED_DELAY' >> nethack/include/date.h

      - name: "Step 2: Generate and Compile App for Physical iPhone Hardware"
        run: |
          xcodegen generate
          
          # Built explicitly for 64-bit arm64 iOS hardware targets
          xcodebuild build \
            -project "iNetHack.xcodeproj" \
            -scheme "iNetHack" \
            -configuration Debug \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "build_output" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: "Step 3: Package App Layout into an .ipa Installer"
        run: |
          # Create packaging directory
          mkdir -p Payload
          
          # FIXED: Swapped 'H' to matches the exact case of PRODUCT_NAME (iNethack2.app)
          cp -r build_output/Build/Products/Debug-iphoneos/iNethack2.app Payload/
          
          # Zip into installer package
          zip -r iNetHack2.ipa Payload

      - name: "Step 4: Upload Installer to GitHub Actions"
        uses: actions/upload-artifact@v4
        with:
          name: iNetHack2-iPhone-Installer
          path: iNetHack2.ipa
