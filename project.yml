name: iNetHack2
options:
  bundleIdPrefix: com.yourcompany

# =========================================================================
# CORRECTED CONFIGURATIONS & SETTINGS
# =========================================================================
configs:
  Debug: debug
  Release: release
  Distribution: release

settings:
  base:
    # Core Build Settings from your configuration block
    SDKROOT: iphoneos
    IPHONEOS_DEPLOYMENT_TARGET: "12.0"
    GCC_C_LANGUAGE_STANDARD: c99
    CLANG_ENABLE_MODULES: NO
    ENABLE_STRICT_OBJC_MSGSEND: YES
    GCC_NO_COMMON_BLOCKS: YES
    
    # Modernized Warning Flags matching your PBXProj
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    CLANG_WARN_BLOCK_CAPTURE_AUTORELEASING: YES
    CLANG_WARN_BOOL_CONVERSION: YES
    CLANG_WARN_COMMA: YES
    CLANG_WARN_CONSTANT_CONVERSION: YES
    CLANG_WARN_DEPRECATED_OBJC_IMPLEMENTATIONS: YES
    CLANG_WARN_EMPTY_BODY: YES
    CLANG_WARN_ENUM_CONVERSION: YES
    CLANG_WARN_INFINITE_RECURSION: YES
    CLANG_WARN_INT_CONVERSION: YES
    CLANG_WARN_NON_LITERAL_NULL_CONVERSION: YES
    CLANG_WARN_OBJC_IMPLICIT_RETAIN_SELF: YES
    CLANG_WARN_OBJC_LITERAL_CONVERSION: YES
    CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: YES
    CLANG_WARN_RANGE_LOOP_ANALYSIS: YES
    CLANG_WARN_STRICT_PROTOTYPES: YES
    CLANG_WARN_SUSPICIOUS_MOVE: YES
    CLANG_WARN_UNREACHABLE_CODE: YES
    CLANG_WARN__DUPLICATE_METHOD_MATCH: YES
    GCC_WARN_64_TO_32_BIT_CONVERSION: YES
    GCC_WARN_ABOUT_RETURN_TYPE: YES
    GCC_WARN_UNDECLARED_SELECTOR: YES
    GCC_WARN_UNINITIALIZED_AUTOS: YES
    GCC_WARN_UNUSED_FUNCTION: YES
    GCC_WARN_UNUSED_VARIABLE: YES
    "CODE_SIGN_IDENTITY[sdk=iphoneos*]": "iPhone Developer"

targets:
  # =========================================================================
  # 1. THE MAIN iOS APP FRONTEND
  # =========================================================================
  iNetHack2:
    type: application
    platform: iOS
    deploymentTarget: "12.0"
    
    # Links your system frameworks + the static 3.6 library engine automatically
    dependencies:
      - target: NetHackEngine36
      - framework: Foundation.framework
      - framework: UIKit.framework
      - framework: CoreGraphics.framework
      - framework: QuartzCore.framework
      - framework: SystemConfiguration.framework

    settings:
      base:
        INFOPLIST_FILE: Classes/Info.plist # Adjust path to your Info.plist location
        GCC_PREFIX_HEADER: Other Sources/iNethack_Prefix.pch
        GCC_PRECOMPILE_PREFIX_HEADER: YES
        SWIFT_OBJC_BRIDGING_HEADER: iNetHack2-Bridging-Header.h
      configs:
        Debug:
          ONLY_ACTIVE_ARCH: YES
          ENABLE_TESTABILITY: YES

    # Frontend source groupings mirroring your project layout
    sources:
      - path: Classes
        name: Classes
      - path: main.m
        name: Other Sources
      - path: lib
        name: Other Sources/lib
        optional: true
      
      # UI Layer Assets, XIBs and Fonts
      - path: iNetHack2/Images-2.xcassets
        name: Resources
      - path: Tilesets
        name: Resources/Tilesets
      - path: Classes/MainMenuView.xib
        name: Resources
      - path: Classes/MainWindow.xib
        name: Resources
      - path: Px437_IBM_VGA_8x16.ttf
        name: Resources
      - path: MainView.xib
        name: Resources
      - path: MenuView.xib
        name: Resources
      - path: NethackMenuView.xib
        name: Resources
      - path: DirectionInputView.xib
        name: Resources
      - path: TextInputView.xib
        name: Resources
      - path: MenuViewLeaf.xib
        name: Resources
      - path: ExtendedCommandView.xib
        name: Resources
      - path: ItemAmountView.xib
        name: Resources
      - path: Settings.bundle
        name: Resources
      - path: credits.html
        name: Resources
      - path: manual.html
        name: Resources
      - path: Icon.png
        name: Resources
      - path: Entitlements.plist
        name: Resources

# =========================================================================
  # 2. THE ISOLATED NETHACK 3.6 ENGINE
  # =========================================================================
  NetHackEngine36:
    type: library.static
    platform: iOS
    deploymentTarget: "12.0"
    
    settings:
      base:
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/nethack/include
          - $(SRCROOT)/nethack/win/iphone

    # =========================================================================
    # TILEMAP GENERATOR BUILD SCRIPT
    # =========================================================================
    preBuildScripts:
      - name: "Generate NetHack Tilemaps"
        script: |
          cd "${SRCROOT}/nethack/win"
          gcc -I../include -I../src -Wp,-w share/tilemap.c -o tilemap_generator
          ./tilemap_generator
          rm tilemap_generator # Clean up binary artifact after execution
        runOnlyForDeploymentPostprocessing: false

    sources:
      - path: nethack/src
        name: nethack/src
      - path: nethack/win/iphone
        name: nethack/win/iphone
      - path: dat
        name: Resources/dat
        optional: true
