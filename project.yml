name: iNetHack2
options:
  bundleIdPrefix: com.yourcompany

# =========================================================================
# CORRECTED CONFIGURATIONS & SETTINGS
# =========================================================================
configs:
  Debug: debug
  Release: release
  Distribution: release

settings:
  base:
    # Core Build Settings from your configuration block
    CLANG_ENABLE_OBJC_ARC: NO
    SDKROOT: iphoneos
    IPHONEOS_DEPLOYMENT_TARGET: "12.0"
    GCC_C_LANGUAGE_STANDARD: c99
    CLANG_ENABLE_MODULES: YES
    ENABLE_STRICT_OBJC_MSGSEND: YES
    GCC_NO_COMMON_BLOCKS: YES
    
    # Modernized Warning Flags matching your PBXProj
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    CLANG_WARN_BLOCK_CAPTURE_AUTORELEASING: YES
    CLANG_WARN_BOOL_CONVERSION: YES
    CLANG_WARN_COMMA: YES
    CLANG_WARN_CONSTANT_CONVERSION: YES
    CLANG_WARN_DEPRECATED_OBJC_IMPLEMENTATIONS: YES
    CLANG_WARN_EMPTY_BODY: YES
    CLANG_WARN_ENUM_CONVERSION: YES
    CLANG_WARN_INFINITE_RECURSION: YES
    CLANG_WARN_INT_CONVERSION: YES
    CLANG_WARN_NON_LITERAL_NULL_CONVERSION: YES
    CLANG_WARN_OBJC_IMPLICIT_RETAIN_SELF: YES
    CLANG_WARN_OBJC_LITERAL_CONVERSION: YES
    CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: YES
    CLANG_WARN_RANGE_LOOP_ANALYSIS: YES
    CLANG_WARN_STRICT_PROTOTYPES: YES
    CLANG_WARN_SUSPICIOUS_MOVE: YES
    CLANG_WARN_UNREACHABLE_CODE: YES
    CLANG_WARN__DUPLICATE_METHOD_MATCH: YES
    GCC_WARN_64_TO_32_BIT_CONVERSION: YES
    GCC_WARN_ABOUT_RETURN_TYPE: YES
    GCC_WARN_UNDECLARED_SELECTOR: YES
    GCC_WARN_UNINITIALIZED_AUTOS: YES
    GCC_WARN_UNUSED_FUNCTION: YES
    GCC_WARN_UNUSED_VARIABLE: YES
    "CODE_SIGN_IDENTITY[sdk=iphoneos*]": "iPhone Developer"

targets:
  # =========================================================================
  # 1. THE MAIN iOS APP FRONTEND
  # =========================================================================
  iNetHack2:
    type: application
    platform: iOS
    deploymentTarget: "12.0"
    
    # Links your system frameworks + the static 3.6 library engine automatically
    dependencies:
      - target: NetHackEngine36
      - sdk: Foundation.framework
      - sdk: UIKit.framework
      - sdk: CoreGraphics.framework
      - sdk: QuartzCore.framework
      - sdk: SystemConfiguration.framework

    settings:
      base:
        INFOPLIST_FILE: Classes/Info.plist
        GCC_PREFIX_HEADER: Classes/iNethack_Prefix.pch
        GCC_PRECOMPILE_PREFIX_HEADER: YES
        SWIFT_OBJC_BRIDGING_HEADER: Classes/iNetHack2-Bridging-Header.h
    
      HEADER_SEARCH_PATHS:
        - $(inherited)
        - "$(SRCROOT)/nethack/include"
        - "$(SRCROOT)/nethack/win/iphone"
      configs:
        Debug:
          ONLY_ACTIVE_ARCH: YES
          ENABLE_TESTABILITY: YES

    # Frontend source groupings mirroring your project layout
    sources:
      - path: Classes
        name: Classes
      - path: lib
        name: Other Sources/lib
        optional: true
      
      - path: Resources
        name: Resources

  # =========================================================================
  # 2. THE ISOLATED NETHACK 3.6 ENGINE
  # =========================================================================
  NetHackEngine36:
    type: library.static
    platform: iOS
    deploymentTarget: "12.0"
    
    settings:
      base:
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/nethack/include
          - $(SRCROOT)/nethack/win/iphone


    sources:
      - path: nethack/include
        name: nethack/include
      - path: nethack/src
        name: nethack/src
      - path: nethack/win
        name: nethack/win
      - path: dat
        name: Resources/dat
        optional: true
