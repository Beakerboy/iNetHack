# 1. This controls the name of the generated Xcode project file (e.g., iNetHack.xcodeproj)
name: iNetHack

options:
  bundleIdPrefix: com.beakerboy

targets:
  iNetHack: 
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    info:
      path: Info.plist

    entitlements:
      path: iNetHack.entitlements

    frameworks:
      - sdk: Foundation.framework
      - sdk: UIKit.framework
      - sdk: CoreGraphics.framework

    sources:
      # --- TARGETED COMPILER OVERRIDES FOR IOS FRONTEND CODE ---
      - path: Classes
        compilerFlags: "-x objective-c"
      - path: win/iphone
        compilerFlags: "-x objective-c -Wno-error=incompatible-function-pointer-types -Wno-initializer-overrides"
      - path: Settings.bundle
      - path: nethack
        excludes:
          - "**/README.xcode"
          - "**/README.md"          
          - "**/Info.plist"         
          - "**/Makefile*"          
          - "**/*.rc"               
          - "**/sys/vms/**"            
          - "**/sys/unix/**"           
          - "**/sys/windows/**"        
          - "**/sys/amiga/**"          
          - "**/sys/msdos/**"          
          - "**/sys/share/**"          
          - "**/outdated/**"           
          
          # --- WINDOW SYSTEM STRIPIFY FILTERS ---
          - "**/win/Qt/**"          
          - "**/win/X11/**"         
          - "**/win/gem/**"         
          - "**/win/gnome/**"       
          - "**/win/proxy/**"       
          - "**/win/tty/**"         
          - "**/win/chain/**"       
          - "**/win/win32/**"       
          - "**/win/share/**" 

          # --- AUDIO BACKEND ENGINE FILTERS ---
          - "**/sound/**"           
          
          # --- UTILITY & API LIBRARY FILTERS ---
          - "**/util/**"            
          - "**/sys/libnh/**"       

          # --- COMPLETE CURSES & TERMINAL STRIPPER ---
          # We block ALL curses submodules and core curses window code files entirely!
          - "**/submodules/pdcurses/**"       
          - "**/submodules/pdcursesmod/**"    
          - "**/win/curses/**"        # <-- Completely prevents NetHack from trying to use a text terminal backend

          # --- LUA SOURCE PATCHES ---
          - "**/submodules/lua/testes/**"             
          - "**/onelua.c" # <-- SIMPLIFIED BROAD WILDCARD
          
          - "**/*.xpm"                             
          - "**/*.mif"                             
          - "**/*.md"                              
      - path: gfx
      - path: iNethack2
      - path: Tilesets
      
    settings:
      base:
        ARCHS: "$(ARCHS_STANDARD)"
        GCC_C_LANGUAGE_STANDARD: gnu99
        PRODUCT_NAME: iNethack2 
        PRODUCT_BUNDLE_IDENTIFIER: com.beakerboy.inethack2
        MARKETING_VERSION: "2.1.5"       
        CURRENT_PROJECT_VERSION: "47"    
        
        CLANG_ENABLE_OBJC_ARC: NO       
        
        GCC_PREPROCESSOR_DEFINITIONS:
          - "l_system(x)=-1"
        
        HEADER_SEARCH_PATHS: 
          - "$(SRCROOT)/nethack/include"
          - "$(SRCROOT)/nethack/sys/share"          
          - "$(SRCROOT)/nethack/win/share"          
          - "$(SRCROOT)/nethack/submodules/lua"     
          - "$(SRCROOT)/nethack/submodules/lua/src" 
          - "$(SRCROOT)/nethack/submodules/pdcursesmod"
