name: iNetHack2

configs:
  Debug:
    style: debug
    name: Debug
  Release:
    style: release
    name: Release
  Distribution:
    style: release
    name: Distribution

settings:
  base:
    CLANG_ENABLE_OBJC_ARC: NO
    SDKROOT: iphoneos
    IPHONEOS_DEPLOYMENT_TARGET: "12.0"
    GCC_C_LANGUAGE_STANDARD: c99
    CLANG_ENABLE_MODULES: YES
    ENABLE_STRICT_OBJC_MSGSEND: YES
    GCC_NO_COMMON_BLOCKS: YES
    
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    CLANG_WARN_BLOCK_CAPTURE_AUTORELEASING: YES
    CLANG_WARN_BOOL_CONVERSION: YES
    CLANG_WARN_COMMA: YES
    CLANG_WARN_CONSTANT_CONVERSION: YES
    CLANG_WARN_DEPRECATED_OBJC_IMPLEMENTATIONS: YES
    CLANG_WARN_EMPTY_BODY: YES
    CLANG_WARN_ENUM_CONVERSION: YES
    CLANG_WARN_INFINITE_RECURSION: YES
    CLANG_WARN_INT_CONVERSION: YES
    CLANG_WARN_NON_LITERAL_NULL_CONVERSION: YES
    CLANG_WARN_OBJC_IMPLICIT_RETAIN_SELF: YES
    CLANG_WARN_OBJC_LITERAL_CONVERSION: YES
    CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: NO
    CLANG_WARN_RANGE_LOOP_ANALYSIS: YES
    CLANG_WARN_STRICT_PROTOTYPES: YES
    CLANG_WARN_SUSPICIOUS_MOVE: YES
    CLANG_WARN_UNREACHABLE_CODE: YES
    CLANG_WARN__DUPLICATE_METHOD_MATCH: YES
    GCC_WARN_64_TO_32_BIT_CONVERSION: YES
    GCC_WARN_ABOUT_RETURN_TYPE: YES
    GCC_WARN_UNDECLARED_SELECTOR: YES
    GCC_WARN_UNINITIALIZED_AUTOS: YES
    GCC_WARN_UNUSED_FUNCTION: YES
    GCC_WARN_UNUSED_VARIABLE: YES
    "CODE_SIGN_IDENTITY[sdk=iphoneos*]": "iPhone Developer"

targets:
  # =========================================================================
  # 1. THE MAIN iOS APP FRONTEND
  # =========================================================================
  iNetHack2:
    type: application
    platform: iOS
    deploymentTarget: "12.0"
    
    dependencies:
      - target: NetHackEngine36
      - sdk: Foundation.framework
      - sdk: UIKit.framework
      - sdk: CoreGraphics.framework
      - sdk: QuartzCore.framework
      - sdk: SystemConfiguration.framework

    settings:
      base:
        MARKETING_VERSION: "2.2.0"
        INFOPLIST_FILE: Classes/Info.plist
        GCC_PREFIX_HEADER: Classes/iNethack_Prefix.pch
        GCC_PRECOMPILE_PREFIX_HEADER: YES
        SWIFT_OBJC_BRIDGING_HEADER: Classes/iNetHack2-Bridging-Header.h
          
        MACH_O_TYPE: mh_execute
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_LAUNCHIMAGE_NAME: LaunchImage
        PRODUCT_BUNDLE_IDENTIFIER: com.beakerboy.inethack2
        OTHER_CFLAGS: 
          - $(inherited)
          - "-Wno-deprecated-non-prototype"

      configs:
        Debug:
          ONLY_ACTIVE_ARCH: YES
        Release:
          VALIDATE_PRODUCT: YES
          DEPLOYMENT_POSTPROCESSING: YES

    postBuildScripts:
      - name: "Copy NetHack Game Data Flat to App Root"
        script: |
          set -e
          echo "=== Copying Data Files Flat into Application Container Root ==="
          cp -f "${SRCROOT}/nethack34/dat/"* "${TARGET_BUILD_DIR}/${EXECUTABLE_FOLDER_PATH}/nethack34/"
          cp -f "${SRCROOT}/nethack36/dat/"* "${TARGET_BUILD_DIR}/${EXECUTABLE_FOLDER_PATH}/nethack36/"
        runOnlyForDeploymentPostprocessing: false

    sources:
      - path: Classes
        name: Classes
      - path: lib
        name: Other Sources/lib
        optional: true
      - path: Resources
        name: Resources
        excludes:
          - "Tilesets/nethack34/**"
          - "Tilesets/nethack36/**"
      - path: Resources/Tilesets/nethack34
        name: Resources/Tilesets/nethack34
        type: folder
      - path: Resources/Tilesets/nethack36
        name: Resources/Tilesets/nethack36
        type: folder

  # =========================================================================
  # 2. THE ISOLATED NETHACK 3.6 ENGINE
  # =========================================================================
  NetHackEngine36:
    type: framework
    platform: iOS
    deploymentTarget: "12.0"
    info:
      path: NetHackEngine36/Info.plist
      properties:
        CFBundleIdentifier: "beakerboy.NetHackEngine36"
        CFBundleName: "NetHackEngine36"
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"

    settings:
      PRODUCT_MODULE_NAME: NetHackEngine36
      CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: NO
      DEFINES_MODULE: YES
      CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES: YES
      
      HEADER_SEARCH_PATHS:
        - $(inherited)
        - nethack36/include
        - Classes/win/iphone
        - nethack36/sys/share
      OTHER_CFLAGS: 
        - $(inherited)
        - "-Wno-deprecated-non-prototype"

    sources:
      - path: nethack36/include/NetHackEngine36.h
        headerVisibility: public
      - path: nethack36/include/EngineWrapper36.h
        headerVisibility: public
      - path: nethack36/include
        name: nethack36/include
        headerVisibility: private
        excludes:
          - "NetHackEngine36.h"
          - "EngineWrapper36.h"
      - path: nethack36/src
        name: nethack36/src
      - path: nethack36/win/iphone
        name: nethack36/win/iphone
      - path: nethack36/sys/share
        name: nethack36/sys/share
        includes:
          - "posixregex.c"

